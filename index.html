<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وبینار سئو فارسی — ۲۱ آبان</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#aaa;}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;text-align:center;}
.container{max-width:700px;margin:0 auto;padding:4rem 1.5rem;}
h1{font-size:2.6rem;margin-bottom:1rem;}
.date{font-size:1.4rem;color:var(--muted);margin-bottom:2rem;}
.btn{background:var(--fg);color:var(--bg);padding:1rem 2rem;text-decoration:none;border-radius:4px;font-size:1.1rem;}
.agenda{text-align:right;margin:3rem 0;}
li{margin:0.5rem 0;}
</style>
</head>
<body>
<div class="container">
<h1>وبینار سئو عملی فارسی</h1>
<p class="date">۲۱ آبان ۱۴۰۵ — ساعت ۱۸:۰۰</p>
<p>چگونه سایت فارسی خود را به صفحه اول گوگل برسانیم</p>
<a href="#register" class="btn">ثبت‌نام رایگان</a>
<div class="agenda">
<h2>سرفصل مطالب</h2>
<ul>
<li>تحقیق کلیدواژه فارسی</li>
<li>ساختار سایت و سختافزار</li>
<li>پیوندسازی داخلی</li>
<li>ابزارهای اندازه‌گیری</li>
</ul>
</div>
<section id="register">
<form>
<input type="email" placeholder="ایمیل" style="padding:0.8rem;width:250px;" required>
<button class="btn" type="submit" style="margin-top:1rem;">ثبت</button>
</form>
</section>
</div>
</body>
</html>
